<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIDE — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060911; --bg2:#0A0F1C; --glass:rgba(255,255,255,0.035); --glass-hi:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.09); --line-soft:rgba(255,255,255,0.05);
    --cyan:#3FE8E0; --emerald:#2FE897; --red:#FF5C7A; --amber:#F7B84B; --purple:#9C8CFF;
    --text:#E9EEF7; --muted:#7C89A3; --muted-2:#57647D;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; color:var(--text); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 10% -5%, rgba(63,232,224,0.09), transparent 55%),
      radial-gradient(ellipse 800px 500px at 95% 10%, rgba(47,232,151,0.07), transparent 55%),
      radial-gradient(ellipse 700px 600px at 50% 100%, rgba(156,140,255,0.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* ---------- glass primitives ---------- */
  .glass{ background:var(--glass); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(18px) saturate(140%); position:relative; }
  .glass::before{ content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg, rgba(63,232,224,0.25), transparent 40%, rgba(47,232,151,0.15));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none; opacity:.6; }

  /* ---------- header ---------- */
  header{ position:relative; padding:18px 16px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line-soft); }
  .header-top{ display:flex; justify-content:flex-end; gap:8px; }
  .icon-btn{ background:var(--glass); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; }
  .icon-btn:hover{ border-color:var(--cyan); box-shadow:0 0 12px rgba(63,232,224,0.25); }
  .lang-switch{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .lang-opt{ background:var(--glass); color:var(--muted); border:none; padding:0 12px; height:36px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; cursor:pointer; }
  .lang-opt.active{ background:var(--cyan); color:#04141A; }
  .header-main{ display:flex; flex-direction:column; gap:12px; }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{ font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; margin:0; letter-spacing:0.5px; line-height:1;
    background:linear-gradient(90deg,var(--cyan),var(--emerald)); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(63,232,224,0.25)); }
  .brand .badge{ font-size:11px; padding:4px 10px; border-radius:20px; background:var(--glass); border:1px solid var(--line); color:var(--muted); letter-spacing:0.5px; }
  @media (min-width:640px){ .brand h1{ font-size:52px; } }
  .tagline{ color:var(--muted); font-size:12.5px; max-width:540px; line-height:1.5; }
  .status{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--emerald); box-shadow:0 0 8px var(--emerald); animation:pulseDot 2s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* ---------- USP strip ---------- */
  .usp-strip{ display:flex; flex-direction:column; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-soft); }
  .usp-item{ display:flex; align-items:center; gap:12px; }
  .usp-wave{ width:52px; height:22px; flex:0 0 auto; overflow:hidden; }
  .usp-wave svg{ width:200%; height:100%; animation:waveScroll 5s linear infinite; }
  @keyframes waveScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .usp-heartbeat{ width:52px; height:22px; flex:0 0 auto; overflow:hidden; }
  .usp-heartbeat svg{ width:200%; height:100%; animation:hbScroll 3.2s linear infinite; }
  @keyframes hbScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .usp-text b{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; letter-spacing:0.4px; }
  .usp-text p{ margin:2px 0 0; font-size:11.5px; color:var(--muted); line-height:1.4; max-width:320px; }
  @media (min-width:760px){ .usp-strip{ flex-direction:row; align-items:center; gap:28px; padding:14px clamp(16px,4vw,40px); } }
  .usp-guide-cta{
    display:flex; align-items:center; gap:12px; text-decoration:none; cursor:pointer;
    padding:10px 14px; margin-left:auto; border-radius:14px;
    background:rgba(63,232,224,0.09); border:1px solid rgba(63,232,224,0.4);
    transition:all .2s; flex:0 0 auto;
  }
  .usp-guide-cta:hover{ background:rgba(63,232,224,0.18); box-shadow:0 0 18px rgba(63,232,224,0.25); border-color:var(--cyan); }
  .usp-guide-icon{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--cyan); color:#04141A; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .usp-guide-cta .usp-text b{ color:var(--cyan); }
  @media (max-width:759px){ .usp-guide-cta{ margin-left:0; } }

  .global-banner{ background:rgba(255,92,122,0.10); border-bottom:1px solid rgba(255,92,122,0.3); color:var(--red); font-size:12px; line-height:1.6; padding:10px 16px; }
  .global-banner[hidden]{ display:none; }

  main{ padding:20px 16px 60px; max-width:1440px; margin:0 auto; }
  section.block{ margin-bottom:26px; }
  .block-title{ font-family:'Space Grotesk',sans-serif; font-size:11.5px; letter-spacing:1.3px; text-transform:uppercase; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:10px; }
  .block-title-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .block-title-row .block-title{ margin-bottom:0; flex:1; }
  .info-btn{ flex:0 0 auto; height:26px; padding:0 12px; border-radius:13px; background:rgba(63,232,224,0.12); border:1px solid rgba(63,232,224,0.45); color:var(--cyan); font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; text-decoration:none; }
  .info-btn .info-icon{ width:15px; height:15px; border-radius:50%; background:var(--cyan); color:#04141A; font-size:10px; font-weight:700; font-style:italic; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .info-btn:hover, .info-btn[aria-expanded="true"]{ background:rgba(63,232,224,0.22); box-shadow:0 0 14px rgba(63,232,224,0.35); }
  .depth-info{ margin-bottom:14px; padding:14px 16px; border-radius:12px; background:var(--glass-hi); border:1px solid var(--line); font-size:12px; color:var(--muted); line-height:1.6; }
  .depth-info[hidden]{ display:none; }
  .depth-info .depth-info-illustration{ width:100%; max-width:320px; aspect-ratio:3/1; height:auto; display:block; margin:0 0 10px; background:rgba(255,255,255,0.03); border-radius:8px; }
  .depth-info b{ color:var(--text); }
  .block-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .block-title .kbd{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }

  /* ---------- style/timeframe tabs ---------- */
  .styletabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .styletab{ flex:1 1 auto; text-align:left; background:var(--glass); border:1px solid var(--line); color:var(--muted); padding:10px 14px; border-radius:12px; cursor:pointer; transition:all .25s; }
  .styletab .st-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; color:var(--text); display:block; }
  .styletab .st-tf{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); }
  .styletab:hover{ border-color:var(--cyan); }
  .styletab.active{ border-color:var(--cyan); background:linear-gradient(135deg, rgba(63,232,224,0.12), rgba(47,232,151,0.06)); box-shadow:0 0 20px rgba(63,232,224,0.12); }
  .style-desc{ color:var(--muted); font-size:12px; margin:0 0 18px; line-height:1.6; max-width:760px; }

  /* ---------- top action row ---------- */
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .action-btn{ background:var(--glass); border:1px solid var(--line); color:var(--text); font-size:12px; padding:9px 14px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .action-btn:hover{ border-color:var(--emerald); }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg2); border:1px solid var(--emerald); color:var(--emerald); padding:9px 18px; border-radius:10px; font-size:12.5px; opacity:0; pointer-events:none; transition:all .3s; z-index:80; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- asset grid ---------- */
  .grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  .card{ padding:18px; container-type:inline-size; container-name:assetcard; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .sym-row{ display:flex; align-items:center; gap:10px; }
  .sym{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; }
  .name{ color:var(--muted); font-size:11px; }
  .price{ font-family:'IBM Plex Mono',monospace; font-size:17px; text-align:right; }
  .chg{ font-size:11.5px; text-align:right; font-family:'IBM Plex Mono',monospace; }
  .chg.up{ color:var(--emerald); } .chg.down{ color:var(--red); }

  .gauge-chart-row{ display:flex; gap:16px; align-items:center; margin-bottom:10px; }
  .gauge-wrap{ position:relative; flex:0 0 auto; width:84px; height:84px; }
  .gauge-wrap svg{ width:100%; height:100%; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; line-height:1; }
  .gauge-zone{ font-size:8px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; text-align:center; }
  .gauge-wave{ position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); width:40px; height:12px; overflow:hidden; opacity:.8; }
  .gauge-wave svg{ width:200%; height:100%; animation:waveScroll 4s linear infinite; }

  .chart-wrap{ flex:1; min-width:0; }
  .chart-canvas{ width:100%; height:78px; display:block; }
  .macd-canvas{ width:100%; height:22px; display:block; margin-top:2px; }

  .insight{ font-size:11.5px; color:var(--muted); line-height:1.5; padding:8px 10px; background:var(--glass-hi); border-radius:8px; border-left:2px solid var(--cyan); margin-bottom:10px; }
  .insight b{ color:var(--text); }
  .insight .tag{ font-size:8.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-2); display:block; margin-bottom:3px; }

  .expand-btn{ width:100%; background:transparent; border:1px dashed var(--line); color:var(--muted); font-size:11px; padding:6px; border-radius:8px; cursor:pointer; margin-bottom:8px; }
  .expand-btn:hover{ border-color:var(--cyan); color:var(--text); }
  .detail{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .detail.open{ max-height:900px; }
  .detail-inner{ padding-top:6px; }

  .factors{ display:grid; grid-template-columns:1fr; gap:9px; margin-bottom:10px; }
  @container assetcard (min-width:420px){ .factors{ grid-template-columns:1fr 1fr; gap:8px 16px; } }
  .factor{ font-size:11px; }
  .factor.dim{ opacity:.32; }
  .factor-row{ display:flex; justify-content:space-between; color:var(--muted); margin-bottom:3px; gap:6px; }
  .factor-row b{ color:var(--text); font-weight:500; font-family:'IBM Plex Mono',monospace; }
  .fbar{ height:4px; border-radius:2px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .fbar i{ display:block; height:100%; border-radius:2px; background:linear-gradient(90deg,var(--cyan),var(--emerald)); }
  .risk-line{ font-size:10.5px; color:var(--muted); margin-bottom:10px; }

  .setup-levels{ margin-bottom:10px; padding:12px; border-radius:12px; background:var(--glass-hi); border:1px solid var(--line); }
  .setup-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .setup-title{ font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--muted); }
  .setup-dir{ font-size:10.5px; font-weight:600; padding:2px 9px; border-radius:20px; }
  .setup-dir.setup-long{ background:rgba(47,232,151,0.16); color:var(--emerald); }
  .setup-dir.setup-short{ background:rgba(255,92,122,0.16); color:var(--red); }
  .setup-rows{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-bottom:8px; }
  .setup-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); gap:8px; }
  .setup-row b{ color:var(--text); font-weight:600; }
  .setup-row.setup-invalid b{ color:var(--red); }
  .setup-row.setup-target b{ color:var(--emerald); }
  .setup-rr{ font-size:10.5px; color:var(--cyan); font-family:'IBM Plex Mono',monospace; margin-bottom:6px; }
  .setup-disclaimer{ font-size:9.5px; color:var(--muted-2); line-height:1.4; }
  .setup-neutral{ font-size:11.5px; color:var(--muted); font-style:italic; }
  .risk-line b{ color:var(--text); }
  .data-note{ margin-bottom:8px; padding:7px 9px; border-radius:7px; background:rgba(255,92,122,0.08); border:1px solid rgba(255,92,122,0.3); font-size:10.5px; color:var(--red); }
  .data-note[hidden]{ display:none; }

  /* ---------- perp pulse ---------- */
  .perp-pulse{ margin-top:6px; padding-top:12px; border-top:1px dashed var(--line); }
  .pulse-head{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .pulse-hb{ width:38px; height:16px; overflow:hidden; flex:0 0 auto; }
  .pulse-hb svg{ width:200%; height:100%; animation:hbScroll 2.6s linear infinite; }
  .pulse-title{ font-family:'Space Grotesk',sans-serif; font-size:10px; letter-spacing:0.7px; text-transform:uppercase; color:var(--muted); }
  .pulse-source{ font-size:9.5px; color:var(--muted-2); margin-left:auto; }
  .pulse-body{ display:grid; grid-template-columns:1fr; gap:9px; }
  @container assetcard (min-width:420px){ .pulse-body{ grid-template-columns:1.3fr 1fr; align-items:center; } }
  .funding-labels{ display:flex; justify-content:space-between; color:var(--muted); font-size:9px; margin-bottom:4px; }
  .funding-track{ position:relative; height:5px; border-radius:3px; background:linear-gradient(90deg,var(--emerald),rgba(255,255,255,0.06) 48%,rgba(255,255,255,0.06) 52%,var(--red)); }
  .funding-marker{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%; background:#fff; box-shadow:0 0 8px rgba(255,255,255,.6); transform:translate(-50%,-50%); transition:left .8s ease; }
  .funding-val{ margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .pulse-stats{ display:flex; justify-content:space-between; align-items:flex-end; gap:8px; }
  .oi-val{ font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .oi-label{ font-size:9px; color:var(--muted); text-transform:uppercase; }
  .flow-badge{ font-size:10px; padding:3px 9px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .flow-badge.flow-bull{ background:rgba(47,232,151,0.14); color:var(--emerald); }
  .flow-badge.flow-bear{ background:rgba(255,92,122,0.14); color:var(--red); }
  .flow-badge.flow-squeeze{ background:rgba(63,232,224,0.16); color:var(--cyan); }
  .flow-badge.flow-neutral{ background:rgba(255,255,255,0.06); color:var(--muted); }
  .pulse-unavailable{ font-size:11px; color:var(--muted); font-style:italic; }

  .binance-pulse{ margin-top:6px; }
  .binance-pulse .pulse-title{ cursor:help; border-bottom:1px dotted var(--muted); }
  .ls-split-track{ display:flex; height:6px; border-radius:3px; overflow:hidden; background:rgba(255,255,255,0.06); }
  .ls-split-long{ background:var(--emerald); height:100%; }
  .ls-split-short{ background:var(--red); height:100%; }
  .ls-ratio{ color:var(--muted); font-weight:400; }
  .binance-spark-wrap{ display:flex; flex-direction:column; gap:2px; }
  .binance-spark{ width:70px; height:20px; display:block; }

  /* ---------- depth chart ---------- */
  .depth-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .depth-tab{ background:var(--glass); border:1px solid var(--line); color:var(--muted); font-size:11.5px; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .depth-tab.active{ border-color:var(--cyan); color:var(--text); }
  .depth-canvas-wrap{ padding:16px; }
  .depth-canvas{ width:100%; height:180px; display:block; }
  .depth-mid{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-top:8px; }

  /* ---------- correlation heatmap ---------- */
  .corr-table{ padding:16px; }
  .corr-grid{ display:grid; grid-template-columns:auto repeat(4,1fr); gap:3px; font-size:11px; }
  .corr-cell{ padding:8px 4px; text-align:center; border-radius:6px; font-family:'IBM Plex Mono',monospace; }
  .corr-head{ color:var(--muted); font-weight:600; display:flex; align-items:center; justify-content:center; }
  .corr-label{ color:var(--muted); display:flex; align-items:center; padding-right:8px; font-weight:600; }

  /* ---------- comparison matrix ---------- */
  .matrix-wrap{ padding:16px; overflow-x:auto; }
  table.matrix{ width:100%; border-collapse:collapse; font-size:12px; min-width:520px; }
  table.matrix th{ text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.matrix td{ padding:9px 10px; border-bottom:1px solid var(--line-soft); font-family:'IBM Plex Mono',monospace; }
  table.matrix td.lbl{ font-family:'IBM Plex Sans',sans-serif; color:var(--muted); }

  /* ---------- signals log ---------- */
  .signals-list{ padding:6px 16px 16px; max-height:220px; overflow-y:auto; }
  .signal-row{ display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:11.5px; }
  .signal-row:last-child{ border-bottom:none; }
  .signal-time{ color:var(--muted-2); font-family:'IBM Plex Mono',monospace; font-size:10px; flex:0 0 auto; }
  .signal-empty{ color:var(--muted); font-size:12px; font-style:italic; padding:10px 0; }

  /* ---------- weights ---------- */
  .weights{ padding:18px 16px; }
  .weights p.hint{ color:var(--muted); font-size:12px; margin:0 0 16px; max-width:680px; line-height:1.55; }
  .wgrid{ display:grid; grid-template-columns:1fr; gap:2px 24px; }
  @media (min-width:760px){ .wgrid{ grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); } }
  .wrow{ display:grid; grid-template-columns:1fr; row-gap:6px; align-items:center; margin-bottom:14px; font-size:12.5px; }
  @media (min-width:760px){ .wrow{ grid-template-columns:150px 1fr 40px; row-gap:0; } .wrow .wval{ text-align:right; } }
  .wrow label{ color:var(--text); }
  .wrow .wval{ font-family:'IBM Plex Mono',monospace; color:var(--muted); }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:rgba(255,255,255,0.08); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--cyan); cursor:pointer; box-shadow:0 0 8px var(--cyan); }
  .wsum{ margin-top:8px; font-size:12px; color:var(--muted); }
  .wsum.bad{ color:var(--red); }

  footer{ padding:16px; color:var(--muted-2); font-size:10.5px; line-height:1.5; border-top:1px solid var(--line-soft); text-align:center; }

  /* ---------- menu drawer ---------- */
  .menu-overlay{ position:fixed; inset:0; background:rgba(2,4,8,0.65); z-index:50; display:flex; justify-content:flex-end; }
  .menu-overlay[hidden]{ display:none; }
  .menu-panel{ width:100%; max-width:440px; height:100%; background:var(--bg2); border-left:1px solid var(--line); padding:20px 18px 32px; overflow-y:auto; animation:slideIn .25s ease; }
  @keyframes slideIn{ from{ transform:translateX(24px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// ---------- indicator math ----------
function ema(values, period){
  if(!values.length) return [];
  const k = 2/(period+1); const out=[values[0]];
  for(let i=1;i<values.length;i++) out.push(values[i]*k + out[i-1]*(1-k));
  return out;
}
function sma(values, period){ if(values.length<period) return null; return values.slice(-period).reduce((a,b)=>a+b,0)/period; }
function stddev(values, period){
  if(values.length<period) return null;
  const s = values.slice(-period); const m = s.reduce((a,b)=>a+b,0)/period;
  return Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/period);
}
function computeRSI(closes, period){
  if(closes.length < period+1) return null;
  let gains=0, losses=0;
  for(let i=closes.length-period; i<closes.length; i++){
    const d = closes[i]-closes[i-1];
    if(d>=0) gains+=d; else losses-=d;
  }
  const avgGain=gains/period, avgLoss=losses/period;
  if(avgLoss===0) return 100;
  return 100 - 100/(1+avgGain/avgLoss);
}
function computeMACD(closes){
  if(closes.length<40) return null;
  const f=ema(closes,12), s=ema(closes,26);
  const macdArr = f.map((v,i)=>v-s[i]);
  const sig = ema(macdArr,9);
  const hist = macdArr.map((v,i)=>v-sig[i]);
  return { hist:hist[hist.length-1], histPrev:hist[hist.length-2], histArr:hist, macdArr, sig };
}
function computeBB(closes, period=20, mult=2){
  const m=sma(closes,period), sd=stddev(closes,period);
  if(m==null||sd==null) return null;
  const upper=m+mult*sd, lower=m-mult*sd, price=closes[closes.length-1];
  return { percentB: (upper===lower)?50:(price-lower)/(upper-lower)*100, upper, lower, mid:m };
}
function computeOBVTrend(closes, volumes, lookback=10){
  if(closes.length<lookback+1) return null;
  let obv=0; const arr=[0];
  for(let i=1;i<closes.length;i++){
    if(closes[i]>closes[i-1]) obv+=volumes[i]||0;
    else if(closes[i]<closes[i-1]) obv-=volumes[i]||0;
    arr.push(obv);
  }
  const obvSlope = arr[arr.length-1]-arr[arr.length-1-lookback];
  const priceSlope = closes[closes.length-1]-closes[closes.length-1-lookback];
  return { obvSlope, priceSlope };
}
function computeATR(highs, lows, closes, period=14){
  if(highs.length<period+1) return null;
  const tr=[highs[0]-lows[0]];
  for(let i=1;i<highs.length;i++) tr.push(Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1])));
  const recent = tr.slice(-period);
  const atr = recent.reduce((a,b)=>a+b,0)/period;
  const priorSlice = tr.slice(-period*2,-period);
  const atrPrior = priorSlice.length===period ? priorSlice.reduce((a,b)=>a+b,0)/period : atr;
  return { atr, atrPrior, atrPct: atr/closes[closes.length-1]*100 };
}
function computeVWAP(highs, lows, closes, volumes){
  let cumPV=0, cumV=0;
  for(let i=0;i<closes.length;i++){
    const tp=(highs[i]+lows[i]+closes[i])/3;
    cumPV+=tp*(volumes[i]||0); cumV+=(volumes[i]||0);
  }
  return cumV ? cumPV/cumV : closes[closes.length-1];
}
function computeFib(highs, lows, price){
  const hi=Math.max(...highs), lo=Math.min(...lows);
  if(hi===lo) return 50;
  return (hi-price)/(hi-lo)*100;
}
function computeFibLevels(highs, lows){
  const hi=Math.max(...highs), lo=Math.min(...lows);
  const pcts = [0, 23.6, 38.2, 50, 61.8, 78.6, 100];
  const levels = pcts.map(pct => ({ pct, price: hi - (pct/100)*(hi-lo) }));
  return { hi, lo, levels };
}
// Purely mechanical: maps the already-computed zone (Accumulation/Neutral/Distribution)
// onto the nearest Fibonacci levels around the current price. Not a trade recommendation —
// just the existing technical structure organized as concrete price references.
function buildSetupReference(price, fibData, zoneLabel, zoneKind){
  if(!fibData || zoneKind==='neutral') return { direction:'neutral' };
  const levels = fibData.levels.map(l=>l.price).sort((a,b)=>a-b); // ascending: lo..hi
  if(zoneKind==='long'){
    const below = levels.filter(p=>p<=price);
    const above = levels.filter(p=>p>price);
    const entry = below.length ? below[below.length-1] : fibData.lo;
    const invalidation = below.length>1 ? below[below.length-2] : fibData.lo;
    const target1 = above.length ? above[0] : fibData.hi;
    const target2 = above.length>1 ? above[1] : fibData.hi;
    return { direction:'long', entry, invalidation, target1, target2,
      rr: (invalidation!==entry) ? Math.abs(target1-entry)/Math.abs(entry-invalidation) : null };
  } else {
    const above = levels.filter(p=>p>=price);
    const below = levels.filter(p=>p<price);
    const entry = above.length ? above[0] : fibData.hi;
    const invalidation = above.length>1 ? above[1] : fibData.hi;
    const target1 = below.length ? below[below.length-1] : fibData.lo;
    const target2 = below.length>1 ? below[below.length-2] : fibData.lo;
    return { direction:'short', entry, invalidation, target1, target2,
      rr: (invalidation!==entry) ? Math.abs(entry-target1)/Math.abs(invalidation-entry) : null };
  }
}

// ---------- factor scores (0-100, higher = more attractive entry) ----------
function scoreRSI(rsi){ if(rsi==null) return 50; return clamp(((70-rsi)/(70-30))*100,0,100); }
function scoreEMA(price, fast, slow){
  if(fast==null||slow==null) return 50;
  const pctBelowSlow = (price-slow)/slow*100;
  let base = clamp(-pctBelowSlow*1.5,0,100);
  base += (fast>slow) ? 5 : -5;
  return clamp(base,0,100);
}
function scoreMACD(m){
  if(!m) return 50;
  const crossUp = m.histPrev<0 && m.hist>=0;
  let s = 50 + clamp(m.hist*40,-40,40);
  if(crossUp) s += 15;
  return clamp(s,0,100);
}
function scoreBB(bb){ if(!bb) return 50; return clamp(100-bb.percentB,0,100); }
function scoreOBV(o){
  if(!o) return 50;
  const priceDown = o.priceSlope<0, priceUp = o.priceSlope>0;
  const obvUp = o.obvSlope>0, obvDown = o.obvSlope<0;
  if(priceDown && obvUp) return 85;
  if(priceUp && obvUp) return 65;
  if(priceDown && obvDown) return 20;
  if(priceUp && obvDown) return 15;
  return 50;
}
function scoreVWAP(vwap, price){ if(!vwap) return 50; return clamp((vwap-price)/vwap*300+50,0,100); }
function scoreATR(a){
  if(!a || !a.atrPrior) return 50;
  const ratio = a.atr/a.atrPrior;
  if(ratio>1.5) return 20;
  if(ratio<0.8) return 85;
  return 60;
}
function scoreFib(pos){
  if(pos==null) return 50;
  if(pos<=23.6) return pos/23.6*30;
  if(pos<=38.2) return 30+(pos-23.6)/(38.2-23.6)*30;
  if(pos<=61.8) return 60+(pos-38.2)/(61.8-38.2)*35;
  if(pos<=78.6) return 95-(pos-61.8)/(78.6-61.8)*25;
  return clamp(70-(pos-78.6)*1.5,0,100);
}
function scoreATH(pct){ if(pct==null) return 50; return clamp(-pct*1.5,0,100); }
function scoreFGI(fgi){ return clamp(100-fgi,0,100); }
function scoreMom(chg){
  if(chg==null) return 50;
  if(chg>=0) return 0;
  if(chg>=-20) return (-chg/20)*100;
  return clamp(100-(Math.abs(chg)-20)*4,0,100);
}
// Contrarian scoring for the Binance top-trader long/short ratio: crowded longs (high ratio)
// score LOW (bearish/expensive), crowded shorts (low ratio) score HIGH (bullish/cheap).
// Continuous piecewise-linear so small ratio changes move the score smoothly, not in jumps.
function scoreBinanceRatio(ratio){
  if(ratio==null) return 50;
  if(ratio<=0.7) return 100;
  if(ratio<=1.4) return 100 - (ratio-0.7)/(1.4-0.7)*50;   // 100 -> 50
  if(ratio<=1.8) return 50 - (ratio-1.4)/(1.8-1.4)*35;    // 50 -> 15
  return clamp(15 - (ratio-1.8)*15, 0, 15);                // 15 -> 0
}
// Position ratio is volume/size-weighted (reflects how much capital is actually leaning
// long/short), account ratio is a simple headcount — position ratio is weighted higher.
function scoreBinance(positionRatio, accountRatio){
  if(positionRatio==null && accountRatio==null) return 50;
  if(positionRatio==null) return scoreBinanceRatio(accountRatio);
  if(accountRatio==null) return scoreBinanceRatio(positionRatio);
  return scoreBinanceRatio(positionRatio)*0.65 + scoreBinanceRatio(accountRatio)*0.35;
}
// CVD (Cumulative Volume Delta): sums actual aggressive taker buy vs sell volume over the
// lookback window, then reads it the same way OBV does — but on sharper, trade-level data
// instead of a whole-candle proxy. Divergence between price direction and CVD direction is
// the signal: price falling while real buying pressure is quietly accumulating (or the
// reverse) is more informative than either fact alone.
function scoreCVD(cvdSlope, priceSlope){
  if(cvdSlope==null || priceSlope==null) return 50;
  const priceDown = priceSlope<0, priceUp = priceSlope>0;
  const cvdUp = cvdSlope>0, cvdDown = cvdSlope<0;
  if(priceDown && cvdUp) return 88;   // bullish divergence — buyers absorbing the dip
  if(priceUp && cvdUp) return 62;     // healthy confirmation, still fine on a pullback
  if(priceDown && cvdDown) return 18; // confirmed selling, no hidden support
  if(priceUp && cvdDown) return 12;   // bearish divergence — rally not backed by real buying
  return 50;
}
// Futures basis: how far the Hyperliquid perp mark price sits from the blended spot price.
// A rich premium (perp > spot) means leveraged longs are paying up to chase price — often an
// overheated, expensive entry. A discount (perp < spot) means the opposite. Same contrarian
// shape as the other derivatives-based factors, just calibrated to typical basis magnitudes
// (a percent or two is already a large, unusual reading, unlike the 0–3 range of a long/short ratio).
function scoreBasis(basisPct){
  if(basisPct==null) return 50;
  const clamped = clamp(basisPct, -3, 3);
  return clamp(50 - clamped*15, 0, 100);
}
function totalScore(scores, w){
  const wsum = Object.values(w).reduce((a,b)=>a+b,0) || 100;
  let sum=0;
  for(const k in w) sum += (scores[k]||0)*w[k];
  return sum/wsum;
}
function zoneOf(score){
  if(score>=70) return {label:t().zones.acc, color:'var(--emerald)', hex:'#2FE897'};
  if(score>=40) return {label:t().zones.neu, color:'var(--cyan)', hex:'#3FE8E0'};
  return {label:t().zones.dist, color:'var(--red)', hex:'#FF5C7A'};
}
function fgiLabelText(v){
  const s = t().sentiment;
  if(v<=24) return s.extremeFear; if(v<=44) return s.fear; if(v<=55) return s.neutral; if(v<=75) return s.greed; return s.extremeGreed;
}

function pearsonCorrelation(a, b){
  const n = Math.min(a.length, b.length);
  if(n<5) return null;
  const av = a.slice(-n), bv = b.slice(-n);
  const am = av.reduce((x,y)=>x+y,0)/n, bm = bv.reduce((x,y)=>x+y,0)/n;
  let num=0, da=0, db=0;
  for(let i=0;i<n;i++){ num += (av[i]-am)*(bv[i]-bm); da += (av[i]-am)**2; db += (bv[i]-bm)**2; }
  const denom = Math.sqrt(da*db);
  return denom===0 ? 0 : num/denom;
}

async function fetchKrakenTicker(assetId){
  const pair = KRAKEN_PAIRS[assetId];
  if(!pair) return null;
  const res = await fetch(`https://api.kraken.com/0/public/Ticker?pair=${pair}`);
  if(!res.ok) throw new Error('Kraken ticker HTTP '+res.status);
  const json = await res.json();
  if(json.error && json.error.length) throw new Error('Kraken ticker error: '+json.error.join(','));
  const result = json.result[Object.keys(json.result)[0]];
  const last = Number(result.c[0]);
  const open = Number(result.o);
  const chg24h = open ? (last-open)/open*100 : 0;
  return { price:last, chg24h, athPct:null };
}
async function fetchKrakenOHLC(assetId, styleKey){
  const pair = KRAKEN_PAIRS[assetId];
  if(!pair) return null;
  const interval = KRAKEN_INTERVAL[styleKey];
  const res = await fetch(`https://api.kraken.com/0/public/OHLC?pair=${pair}&interval=${interval}`);
  if(!res.ok) throw new Error('Kraken OHLC HTTP '+res.status);
  const json = await res.json();
  if(json.error && json.error.length) throw new Error('Kraken OHLC error: '+json.error.join(','));
  const candles = json.result[Object.keys(json.result).find(k=>k!=='last')];
  if(!Array.isArray(candles) || candles.length < 10) throw new Error('no Kraken candle data for '+assetId);
  return {
    times: candles.map(c=>Number(c[0])*1000),
    opens: candles.map(c=>Number(c[1])),
    highs: candles.map(c=>Number(c[2])),
    lows: candles.map(c=>Number(c[3])),
    closes: candles.map(c=>Number(c[4])),
    volumes: candles.map(c=>Number(c[6])),
  };
}

function applyStyleData(styleKey, assetId, times, opens, highs, lows, closes, volumes){
  const cfg = STYLE_PARAMS[styleKey];
  rawOHLC[styleKey][assetId] = { times, opens, highs, lows, closes, volumes };
  const rsi = computeRSI(closes, cfg.rsiPeriod);
  const emaFastArr = ema(closes, cfg.emaFast), emaSlowArr = ema(closes, cfg.emaSlow);
  const macd = computeMACD(closes);
  const bb = computeBB(closes);
  const obv = computeOBVTrend(closes, volumes);
  const atr = computeATR(highs, lows, closes);
  const vwap = (styleKey==='day') ? computeVWAP(highs, lows, closes, volumes) : null;
  const fibPos = computeFib(highs, lows, closes[closes.length-1]);
  let mom = null;
  if(styleKey==='day' && closes.length>2) mom = (closes[closes.length-1]-closes[0])/closes[0]*100;
  if(styleKey==='swing' && closes.length>8) mom = (closes[closes.length-1]-closes[closes.length-8])/closes[closes.length-8]*100;
  if(styleKey==='hodl' && closes.length>2) mom = (closes[closes.length-1]-closes[0])/closes[0]*100;
  styleData[styleKey][assetId] = {
    rsi, emaFast: emaFastArr[emaFastArr.length-1], emaSlow: emaSlowArr[emaSlowArr.length-1],
    emaFastArr, emaSlowArr,
    macdHist: macd?macd.hist:null, macdHistPrev: macd?macd.histPrev:null, macdHistArr: macd?macd.histArr:null,
    bbPercentB: bb?bb.percentB:null, bbUpper: bb?bb.upper:null, bbLower: bb?bb.lower:null,
    obvSlope: obv?obv.obvSlope:null, priceSlope: obv?obv.priceSlope:null,
    atr: atr?atr.atr:null, atrPrior: atr?atr.atrPrior:null, atrPct: atr?atr.atrPct:null,
    vwap, fibPos, mom, _error:false,
  };
}

async function fetchStyleData(styleKey){
  const cfg = STYLE_PARAMS[styleKey];
  for(const a of ASSETS){
    let ok = false;
    try{
      const [ohlcRes, volRes] = await Promise.all([
        fetch(`https://api.coingecko.com/api/v3/coins/${a.id}/ohlc?vs_currency=usd&days=${cfg.ohlcDays}`),
        fetch(`https://api.coingecko.com/api/v3/coins/${a.id}/market_chart?vs_currency=usd&days=${cfg.volDays}`),
      ]);
      if(!ohlcRes.ok) throw new Error('ohlc HTTP '+ohlcRes.status+' for '+a.id);
      if(!volRes.ok) throw new Error('market_chart HTTP '+volRes.status+' for '+a.id);
      const ohlc = await ohlcRes.json();
      const chart = await volRes.json();
      if(!Array.isArray(ohlc) || ohlc.length < 10) throw new Error('no candle data for '+a.id);
      const times = ohlc.map(c=>c[0]), opens = ohlc.map(c=>c[1]), highs = ohlc.map(c=>c[2]), lows = ohlc.map(c=>c[3]), closes = ohlc.map(c=>c[4]);
      const volsRaw = (chart.total_volumes||[]).map(v=>v[1]);
      const volumes = closes.map((_,i)=> volsRaw[Math.min(i, volsRaw.length-1)] || 0);
      applyStyleData(styleKey, a.id, times, opens, highs, lows, closes, volumes);
      ok = true;
    }catch(err){ console.error('CoinGecko candle fetch failed for', a.id, '— trying Kraken', err); }
    if(!ok){
      try{
        const k = await fetchKrakenOHLC(a.id, styleKey);
        if(k){ applyStyleData(styleKey, a.id, k.times, k.opens, k.highs, k.lows, k.closes, k.volumes); ok = true; }
      }catch(err){ console.error('Kraken candle fallback also failed for', a.id, err); }
    }
    if(!ok){
      if(!styleData[styleKey][a.id]) styleData[styleKey][a.id] = { _error:true };
      else styleData[styleKey][a.id]._error = true;
    }
    await new Promise(r=>setTimeout(r, 300));
  }
}

// ---------- Binance top-trader long/short ratio (12th indicator) ----------
// Public market-data endpoints, no API key. Not every browser/network reaches Binance
// reliably (regional restrictions, occasional CORS inconsistencies) — this is treated
// exactly like the other providers: best-effort, cached, never blocks the rest of the app.
let binanceData = {}; // assetId -> { positionRatio, accountRatio, longPct, shortPct, history:[{t,ratio}], ok, fetchedAt }

async function fetchBinanceSeries(endpoint, symbol){
  const res = await fetch(`https://fapi.binance.com/futures/data/${endpoint}?symbol=${symbol}&period=${BINANCE_PERIOD}&limit=30`);
  if(!res.ok) throw new Error('Binance '+endpoint+' HTTP '+res.status);
  const json = await res.json();
  if(!Array.isArray(json) || json.length===0) throw new Error('empty Binance '+endpoint+' payload');
  return json.map(p => ({
    t: Number(p.timestamp),
    ratio: Number(p.longShortRatio),
    longAccount: Number(p.longAccount),
    shortAccount: Number(p.shortAccount),
  }));
}

async function fetchBinanceTopTrader(assetId, force){
  const symbol = BINANCE_SYMBOLS[assetId];
  if(!symbol) return; // e.g. HYPE — no Binance futures market, left as unavailable by design

  const cached = binanceData[assetId];
  if(!force && cached && cached.fetchedAt && (Date.now()-cached.fetchedAt) < BINANCE_CACHE_MS) return; // still fresh, skip refetch

  try{
    const [positionSeries, accountSeries] = await Promise.all([
      fetchBinanceSeries('topLongShortPositionRatio', symbol),
      fetchBinanceSeries('topLongShortAccountRatio', symbol),
    ]);
    const latestPos = positionSeries[positionSeries.length-1];
    const latestAcc = accountSeries[accountSeries.length-1];
    binanceData[assetId] = {
      positionRatio: latestPos.ratio,
      accountRatio: latestAcc.ratio,
      longPct: latestAcc.longAccount*100,
      shortPct: latestAcc.shortAccount*100,
      history: positionSeries.map(p=>({ t:p.t, ratio:p.ratio })),
      ok: true, fetchedAt: Date.now(),
    };
  }catch(err){
    console.error('Binance top-trader fetch failed for', assetId, err);
    // Keep any previously cached good data; otherwise mark unavailable so the UI can
    // show a clear "not available" state instead of hanging or silently showing nothing.
    if(!binanceData[assetId]) binanceData[assetId] = { ok:false, fetchedAt: Date.now() };
    else binanceData[assetId] = { ...binanceData[assetId], ok:false, fetchedAt: Date.now() };
  }
}

// ---------- CVD — Cumulative Volume Delta (13th indicator, BTC/ETH/SOL only) ----------
// Built from Binance's own taker buy/sell volume endpoint — the aggressive-order side of
// every trade, not just whole-candle volume — so it reads real buying/selling pressure
// rather than approximating it the way OBV has to from OHLC data alone.
let cvdData = {}; // assetId -> { slope, priceSlope, history:[{t,delta}], ok, fetchedAt }

async function fetchCVD(assetId, force){
  const symbol = BINANCE_SYMBOLS[assetId];
  if(!symbol) return; // no Binance market for this asset — same "not available" story as Top Trader

  const cached = cvdData[assetId];
  if(!force && cached && cached.fetchedAt && (Date.now()-cached.fetchedAt) < BINANCE_CACHE_MS) return;

  try{
    const res = await fetch(`https://fapi.binance.com/futures/data/takerlongshortRatio?symbol=${symbol}&period=${BINANCE_PERIOD}&limit=30`);
    if(!res.ok) throw new Error('Binance takerlongshortRatio HTTP '+res.status);
    const json = await res.json();
    if(!Array.isArray(json) || json.length===0) throw new Error('empty Binance taker volume payload');
    let running = 0;
    const history = json.map(p=>{
      const buy = Number(p.buyVol), sell = Number(p.sellVol);
      running += (buy - sell);
      return { t: Number(p.timestamp), delta: running };
    });
    const lookback = Math.min(10, history.length-1);
    const slope = history[history.length-1].delta - history[history.length-1-lookback].delta;
    cvdData[assetId] = { slope, history, ok:true, fetchedAt: Date.now() };
  }catch(err){
    console.error('CVD fetch failed for', assetId, err);
    if(!cvdData[assetId]) cvdData[assetId] = { ok:false, fetchedAt: Date.now() };
    else cvdData[assetId] = { ...cvdData[assetId], ok:false, fetchedAt: Date.now() };
  }
}

// Binance Top Trader and CVD both hit the same host for the same assets — fetched together
// per asset (in parallel) rather than as two separate sequential sweeps, so a full refresh
// isn't stuck waiting through two full stagger passes back to back.
async function fetchAllBinanceData(force){
  for(const a of ASSETS){
    await Promise.all([ fetchBinanceTopTrader(a.id, force), fetchCVD(a.id, force) ]);
    await new Promise(r=>setTimeout(r, 250)); // stagger between assets to be a considerate neighbor to the API
  }
}


// ---------- canvas rendering ----------
function drawCandles(canvas, ohlc, overlays){
  if(!canvas || !ohlc) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 100), h = canvas.clientHeight || 78;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const N = Math.min(60, ohlc.closes.length);
  const opens = ohlc.opens.slice(-N), highs = ohlc.highs.slice(-N), lows = ohlc.lows.slice(-N), closes = ohlc.closes.slice(-N);
  const allVals = [...highs, ...lows];
  if(overlays){
    if(overlays.emaFastArr) allVals.push(...overlays.emaFastArr.slice(-N));
    if(overlays.emaSlowArr) allVals.push(...overlays.emaSlowArr.slice(-N));
    if(overlays.bbUpper!=null) allVals.push(overlays.bbUpper, overlays.bbLower);
  }
  const maxV = Math.max(...allVals), minV = Math.min(...allVals);
  const range = (maxV-minV) || 1;
  const padTop=4, padBot=4;
  const y = v => padTop + (h-padTop-padBot) * (1 - (v-minV)/range);
  const cw = w/N;

  // Bollinger band shading
  if(overlays && overlays.bbUpper!=null && overlays.bbLower!=null){
    ctx.fillStyle = 'rgba(63,232,224,0.05)';
    ctx.fillRect(0, y(overlays.bbUpper), w, y(overlays.bbLower)-y(overlays.bbUpper));
  }

  // candles
  for(let i=0;i<N;i++){
    const cx = i*cw + cw/2;
    const up = closes[i]>=opens[i];
    ctx.strokeStyle = up ? '#2FE897' : '#FF5C7A';
    ctx.fillStyle = up ? '#2FE897' : '#FF5C7A';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(highs[i])); ctx.lineTo(cx, y(lows[i])); ctx.stroke();
    const bodyW = Math.max(cw*0.55, 1.5);
    const yo = y(opens[i]), yc = y(closes[i]);
    ctx.fillRect(cx-bodyW/2, Math.min(yo,yc), bodyW, Math.max(Math.abs(yc-yo),1));
  }

  // EMA overlays
  function drawLine(arr, color){
    if(!arr) return;
    const seg = arr.slice(-N);
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
    seg.forEach((v,i)=>{ const cx=i*cw+cw/2; if(i===0) ctx.moveTo(cx,y(v)); else ctx.lineTo(cx,y(v)); });
    ctx.stroke();
  }
  if(overlays){
    drawLine(overlays.emaFastArr, 'rgba(63,232,224,0.85)');
    drawLine(overlays.emaSlowArr, 'rgba(156,140,255,0.85)');
  }
}

function drawMacd(canvas, histArr){
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 100), h = canvas.clientHeight || 22;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!histArr || histArr.length<2) return;
  const N = Math.min(60, histArr.length);
  const seg = histArr.slice(-N);
  const maxAbs = Math.max(...seg.map(Math.abs)) || 1;
  const mid = h/2;
  const cw = w/N;
  seg.forEach((v,i)=>{
    const bh = Math.abs(v)/maxAbs * (h/2-2);
    ctx.fillStyle = v>=0 ? 'rgba(47,232,151,0.7)' : 'rgba(255,92,122,0.7)';
    const bw = Math.max(cw*0.6,1);
    ctx.fillRect(i*cw+cw/2-bw/2, v>=0 ? mid-bh : mid, bw, bh);
  });
}

function gaugeSvg(score, zone){
  const r = 34, circ = 2*Math.PI*r;
  const offset = circ - (score/100)*circ;
  return `<svg viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${zone.hex}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}" transform="rotate(-90 42 42)"
      style="filter:drop-shadow(0 0 5px ${zone.hex}); transition:stroke-dashoffset 1s ease;"/>
  </svg>`;
}
function waveSvg(hex){
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none"><path d="M0,14 Q8,4 16,14 T32,14 T48,14 T64,14 T80,14 T96,14 T112,14" stroke="${hex}" stroke-width="3" fill="none"/></svg>`;
}
function hbSvg(hex){
  return `<svg viewBox="0 0 100 24" preserveAspectRatio="none"><path d="M0,12 L20,12 L26,2 L32,22 L38,12 L100,12 L120,12 L126,2 L132,22 L138,12 L200,12" stroke="${hex}" stroke-width="2.5" fill="none"/></svg>`;

// ---------- insight generator (rule-based, from real computed factors) ----------
function generateInsight(sym, scores, raw, score, zone){
  const L = t();
  const rank = FACTOR_KEYS.map(k=>({k, v:scores[k]})).filter(x=>weights[currentStyle][x.k]>0).sort((a,b)=>Math.abs(b.v-50)-Math.abs(a.v-50));
  const top = rank[0];
  if(!top) return `${sym}: ${zone.label} (${score.toFixed(0)}/100).`;
  const label = L.factors[top.k].label;
  const strong = top.v>=65 ? (currentLang==='de'?'stark für einen Einstieg':'strongly favors an entry') : top.v<=35 ? (currentLang==='de'?'spricht gegen einen Einstieg':'argues against entry now') : (currentLang==='de'?'ist neutral':'is neutral');
  if(currentLang==='de') return `${sym}: ${zone.label}-Zone (${score.toFixed(0)}/100) — ${label} ${strong}.`;
  return `${sym}: ${zone.label} zone (${score.toFixed(0)}/100) — ${label} ${strong}.`;
}

function binanceSparklineSvg(history, hex){
  if(!history || history.length<2) return '';
  const vals = history.map(h=>h.ratio);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const w=100, h=24, pad=2;
  const pts = vals.map((v,i)=>{
    const x = (i/(vals.length-1))*w;
    const y = pad + (h-pad*2) * (1 - (v-min)/range);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="binance-spark"><polyline points="${pts}" fill="none" stroke="${hex}" stroke-width="2"/></svg>`;
}

  if(lastSignalZone[key] === zone.label) return;

  signals.unshift({ sym, label:zone.label, score, ts:new Date() });
  signals = signals.slice(0,12);
  renderSignals();
}
function renderSignals(){
  const el = document.getElementById('signalsList');
  if(!signals.length){ el.innerHTML = `<div class="signal-empty">${currentLang==='de'?'Noch keine Zonenwechsel in dieser Sitzung.':'No zone changes yet this session.'}</div>`; return; }
  el.innerHTML = signals.map(s=>`<div class="signal-row"><span class="signal-time mono">${s.ts.toLocaleTimeString(currentLang==='de'?'de-DE':'en-US')}</span><span><b>${s.sym}</b> → ${s.label} (${s.score.toFixed(0)})</span></div>`).join('');
}

function recomputeAllScores(recordSignals){
  ASSETS.forEach(a=>{
    const m = market[a.id];
    if(!m) return;
    const rawFetch = styleData[currentStyle][a.id];
    const hasFreshData = rawFetch && !rawFetch._error;
    const cached = lastGood[currentStyle][a.id];
    // Binance top-trader ratio, CVD and Futures Basis are all independent data sources (like
    // derivatives) — computed fresh every time regardless of whether the OHLC-based factors
    // are stale, so a slow candle fetch never holds back an already-fresh reading or vice versa.
    const bd = binanceData[a.id];
    const binanceAvailable = !!(bd && bd.ok);
    const binanceScore = binanceAvailable ? scoreBinance(bd.positionRatio, bd.accountRatio) : 50;

    const cd = cvdData[a.id];
    const cvdAvailable = !!(cd && cd.ok);
    const priceSlopeForCvd = hasFreshData ? rawFetch.priceSlope : (cached ? cached.raw.priceSlope : null);
    const cvdScore = cvdAvailable ? scoreCVD(cd.slope, priceSlopeForCvd) : 50;

    const dd = derivData[a.id];
    const basisAvailable = !!(dd && dd.ok && dd.markPx!=null);
    const basisPct = basisAvailable ? (dd.markPx - m.price)/m.price*100 : null;
    const basisScore = basisAvailable ? scoreBasis(basisPct) : 50;

    // When a factor has no usable data for this specific asset, its weight is excluded
    // entirely from the total — not just given a neutral score. A neutral score would still
    // pull the overall result toward 50 with full weight; zeroing the weight instead lets the
    // remaining factors take over that share, exactly as if the slider had been set to 0% for
    // this one asset. (Learned this the hard way with Binance/HYPE — same fix applied up front here.)
    const w = { ...weights[currentStyle] };
    if(!binanceAvailable) w.binance = 0;
    if(!cvdAvailable) w.cvd = 0;
    if(!basisAvailable) w.basis = 0;
    let scores, raw;
    if(hasFreshData){
      raw = { ...rawFetch, athPct: m.athPct, basisPct };
      scores = {
        rsi: scoreRSI(raw.rsi), ema: scoreEMA(m.price, raw.emaFast, raw.emaSlow),
        macd: scoreMACD(raw.macdHist!=null?{hist:raw.macdHist,histPrev:raw.macdHistPrev}:null),
        bb: scoreBB(raw.bbPercentB!=null?{percentB:raw.bbPercentB}:null),
        obv: scoreOBV(raw.obvSlope!=null?{obvSlope:raw.obvSlope,priceSlope:raw.priceSlope}:null),
        vwap: scoreVWAP(raw.vwap, m.price),
        atr: scoreATR(raw.atr!=null?{atr:raw.atr,atrPrior:raw.atrPrior}:null),
        fib: scoreFib(raw.fibPos), ath: scoreATH(m.athPct), fgi: scoreFGI(fgiValue), mom: scoreMom(raw.mom),
        binance: binanceScore, cvd: cvdScore, basis: basisScore,
      };
      lastGood[currentStyle][a.id] = { scores, raw };
    } else if(cached){ raw = { ...cached.raw, basisPct }; scores = { ...cached.scores, binance: binanceScore, cvd: cvdScore, basis: basisScore }; }
    else { raw = { basisPct }; scores = { rsi:50, ema:50, macd:50, bb:50, obv:50, vwap:50, atr:50, fib:50, ath:scoreATH(m.athPct), fgi:scoreFGI(fgiValue), mom:50, binance: binanceScore, cvd: cvdScore, basis: basisScore }; }

    const score = totalScore(scores, w);
    const zone = zoneOf(score);

    document.getElementById('price-'+a.id).textContent = fmtUsd(m.price);
    const chgEl = document.getElementById('chg-'+a.id);
    chgEl.textContent = (m.chg24h>=0?'+':'')+m.chg24h.toFixed(2)+'% 24h';
    chgEl.className = 'chg mono '+(m.chg24h>=0?'up':'down');

    document.getElementById('gauge-'+a.id).innerHTML = gaugeSvg(score, zone) + `<div class="gauge-center"><div class="gauge-num mono" id="score-${a.id}" style="color:${zone.hex}">${score.toFixed(0)}</div><div class="gauge-zone" id="zone-${a.id}">${zone.label}</div></div><div class="gauge-wave">${waveSvg(zone.hex)}</div>`;

    const ohlc = rawOHLC[currentStyle][a.id];
    if(ohlc){
      drawCandles(document.getElementById('chart-'+a.id), ohlc, { emaFastArr: raw.emaFastArr, emaSlowArr: raw.emaSlowArr, bbUpper: raw.bbUpper, bbLower: raw.bbLower });
      drawMacd(document.getElementById('macd-'+a.id), raw.macdHistArr);
    }

    document.getElementById('insight-'+a.id).innerHTML = `<span class="tag">${currentLang==='de'?'Automatischer Insight':'Auto insight'}</span>`+generateInsight(a.sym, scores, raw, score, zone);

    renderFactors(a.id, scores, raw, w);
    renderRisk(a.id, raw);
    renderSetupLevels(a.id, score, zone.label);
    renderBinancePulse(a.id);

    const note = document.getElementById('note-'+a.id);
    const stale = rawFetch && rawFetch._error;
    if(note){ note.hidden = !stale; if(stale) note.textContent = t().dataUnavailable; }

    if(recordSignals) recordSignal(a.sym, zone, score);
  });
  renderCorrelation();
  renderMatrix();
}

function renderCorrelation(){
  const el = document.getElementById('corrGrid');
  const closesById = {};
  ASSETS.forEach(a=>{ const o = rawOHLC[currentStyle][a.id]; if(o) closesById[a.id]=o.closes; });
  let html = `<div></div>`+ASSETS.map(a=>`<div class="corr-cell corr-head">${a.sym}</div>`).join('');
  ASSETS.forEach(rowA=>{
    html += `<div class="corr-cell corr-label">${rowA.sym}</div>`;
    ASSETS.forEach(colA=>{
      if(rowA.id===colA.id){ html += `<div class="corr-cell" style="color:var(--muted-2)">—</div>`; return; }
      const c1 = closesById[rowA.id], c2 = closesById[colA.id];
      const r = (c1 && c2) ? pearsonCorrelation(c1,c2) : null;
      if(r==null){ html += `<div class="corr-cell" style="color:var(--muted-2)">·</div>`; return; }
      const pct = (r*100).toFixed(0);
      const bg = r>0.5 ? 'rgba(47,232,151,'+(0.1+r*0.25)+')' : r<-0.5 ? 'rgba(255,92,122,'+(0.1+Math.abs(r)*0.25)+')' : 'rgba(255,255,255,0.04)';
      const fg = r>0.5 ? 'var(--emerald)' : r<-0.5 ? 'var(--red)' : 'var(--muted)';
      html += `<div class="corr-cell" style="background:${bg}; color:${fg}">${pct}%</div>`;
    });
  });
  el.innerHTML = html;
}

async function loadDepth(assetId){
  focusedDepthAsset = assetId;
  document.querySelectorAll('.depth-tab').forEach(tb=> tb.classList.toggle('active', tb.dataset.asset===assetId));
  const book = await fetchOrderBook(assetId);
  drawDepth(book);
}
function drawDepth(book){
  const canvas = document.getElementById('depthCanvas');
  const mid = document.getElementById('depthMid');
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width,100), h = 180;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  if(!book || !book.bids.length || !book.asks.length){ mid.textContent=''; return; }
  const bestBid = book.bids[0].px, bestAsk = book.asks[0].px;
  mid.textContent = fmtUsd((bestBid+bestAsk)/2);

  let cum=0; const bidCum = book.bids.map(l=>{ cum+=l.sz; return {px:l.px, sz:cum}; });
  cum=0; const askCum = book.asks.map(l=>{ cum+=l.sz; return {px:l.px, sz:cum}; });
  const maxSz = Math.max(bidCum[bidCum.length-1]?.sz||0, askCum[askCum.length-1]?.sz||0) || 1;
  const minPx = bidCum[bidCum.length-1]?.px || bestBid*0.98;
  const maxPx = askCum[askCum.length-1]?.px || bestAsk*1.02;
  const range = maxPx-minPx || 1;
  const x = px => (px-minPx)/range*w;
  const y = sz => h - (sz/maxSz)*(h-8);

  ctx.beginPath(); ctx.moveTo(x(bidCum[0].px), h);
  bidCum.forEach(p=> ctx.lineTo(x(p.px), y(p.sz)));
  ctx.lineTo(x(bidCum[bidCum.length-1].px), h); ctx.closePath();
  ctx.fillStyle='rgba(47,232,151,0.18)'; ctx.fill();
  ctx.strokeStyle='#2FE897'; ctx.lineWidth=1.5; ctx.beginPath();
  bidCum.forEach((p,i)=> i===0?ctx.moveTo(x(p.px),y(p.sz)):ctx.lineTo(x(p.px),y(p.sz))); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(x(askCum[0].px), h);
  askCum.forEach(p=> ctx.lineTo(x(p.px), y(p.sz)));
  ctx.lineTo(x(askCum[askCum.length-1].px), h); ctx.closePath();
  ctx.fillStyle='rgba(255,92,122,0.18)'; ctx.fill();
  ctx.strokeStyle='#FF5C7A'; ctx.lineWidth=1.5; ctx.beginPath();
  askCum.forEach((p,i)=> i===0?ctx.moveTo(x(p.px),y(p.sz)):ctx.lineTo(x(p.px),y(p.sz))); ctx.stroke();
}
function buildDepthTabs(){
  const wrap = document.getElementById('depthTabs'); wrap.innerHTML='';
  ASSETS.forEach(a=>{
    const tab = document.createElement('div');
    tab.className='depth-tab'+(a.id===focusedDepthAsset?' active':'');
    tab.dataset.asset=a.id; tab.textContent=a.sym;

    wrap.appendChild(tab);
  });
}

  document.getElementById('blockWeightsTitle').textContent = L.blockWeights;
  document.getElementById('weightsHint').textContent = L.weightsHint;
  document.getElementById('footerText').textContent = L.footer;
  const footerGuide = document.getElementById('footerGuideLink');
  footerGuide.textContent = L.guideLink;
  footerGuide.setAttribute('href', 'guide.html?lang='+currentLang);
  document.getElementById('menuTitle').textContent = L.menuTitle;
  document.getElementById('menuIntro').textContent = L.menuIntro;
  document.getElementById('menuCloseBtn').setAttribute('aria-label', L.menuClose);
  document.getElementById('menuBtn').setAttribute('aria-label', L.menuTitle);
  document.getElementById('copyBtnLabel').textContent = L.copyBtn;
  document.querySelectorAll('.styletab').forEach(tb=>{
    tb.querySelector('.st-name').textContent = L.styles[tb.dataset.style].label;
  });
  document.getElementById('styleDesc').textContent = L.styles[currentStyle].desc;
  renderStatus(); renderLastUpdate();
  buildWeightSliders(); renderMenu(); renderSignals();
  const banner = document.getElementById('globalBanner');
  if(!banner.hidden) banner.textContent = L.globalBanner;
  if(!document.getElementById('depthInfo').hidden) renderDepthInfo();
}
function renderStatus(){
  const L = t();
  document.getElementById('statusText').textContent = lastStatus==='live' ? L.statusLive : lastStatus==='error' ? L.statusError : L.statusConnecting;
}
function renderLastUpdate(){
  const el = document.getElementById('lastUpdate');
  if(!lastUpdateTs){ el.textContent=''; return; }
  const locale = currentLang==='de' ? 'de-DE' : 'en-US';
  el.textContent = '· '+t().lastUpdatePrefix+' '+lastUpdateTs.toLocaleTimeString(locale);
}

document.querySelectorAll('.lang-opt').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.lang===currentLang) return;
    currentLang = btn.dataset.lang;
    document.documentElement.lang = currentLang;
    document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('active', b.dataset.lang===currentLang));
    applyStaticText(); recomputeAllScores(); renderAllDerivatives();
  });
});

const menuOverlay = document.getElementById('menuOverlay');
function openMenu(){ renderMenu(); menuOverlay.hidden=false; document.body.style.overflow='hidden'; }
function closeMenu(){ menuOverlay.hidden=true; document.body.style.overflow=''; }
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('menuCloseBtn').addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', e=>{ if(e.target===menuOverlay) closeMenu(); });

// ---------- copy snapshot ----------
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 2200);
}
async function copySnapshot(){
  const lines = [`TIDE — ${t().styles[currentStyle].label} — ${new Date().toLocaleString(currentLang==='de'?'de-DE':'en-US')}`];
  ASSETS.forEach(a=>{
    const m = market[a.id]; const d = lastGood[currentStyle][a.id];
    if(!m) return;
    const score = d ? totalScore(d.scores, weights[currentStyle]).toFixed(0) : '–';
    lines.push(`${a.sym}: ${fmtUsd(m.price)} (${m.chg24h>=0?'+':''}${m.chg24h.toFixed(2)}%) — score ${score}`);
  });
  const text = lines.join('\n');
  try{ await navigator.clipboard.writeText(text); showToast(t().copiedToast); }
  catch(e){ console.error('clipboard failed', e); showToast(text.split('\n')[0]); }
}
document.getElementById('copyBtn').addEventListener('click', copySnapshot);

// ---------- keyboard shortcuts ----------
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  if(e.key==='Escape' && !menuOverlay.hidden){ closeMenu(); return; }
  if(e.key==='1') switchStyle('day');
  if(e.key==='2') switchStyle('swing');
  if(e.key==='3') switchStyle('hodl');
  if(e.key==='m' || e.key==='M') openMenu();
  if(e.key==='c' || e.key==='C') copySnapshot();
});

buildDepthTabs();

// ---------- refresh loop ----------
async function refreshAll(){
  try{
    await fetchMarketsAndFGI();
    await fetchStyleData(currentStyle);
    await fetchAllBinanceData(); // Top Trader + CVD together, per asset — internally cached (5 min)
    await fetchDerivatives(); // moved ahead of recomputeAllScores — the Basis factor needs markPx already in hand
    recomputeAllScores(true);
    renderAllDerivatives(); // updates the separate Perp Pulse UI block
    lastStatus = Object.keys(market).length>0 ? 'live' : 'error';
    renderStatus();
    if(Object.keys(market).length>0){ lastUpdateTs = new Date(); renderLastUpdate(); }
  }catch(err){ lastStatus='error'; renderStatus(); console.error(err); }
  loadDepth(focusedDepthAsset);
  const banner = document.getElementById('globalBanner');
  const neverLoaded = Object.keys(market).length === 0;
  banner.hidden = !neverLoaded;
  if(neverLoaded) banner.textContent = t().globalBanner;
}
function resetRefreshTimer(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshAll, STYLE_PARAMS[currentStyle].refresh);
}

window.addEventListener('resize', ()=>{
  ASSETS.forEach(a=>{
    const raw = (lastGood[currentStyle][a.id]||{}).raw;
    const ohlc = rawOHLC[currentStyle][a.id];
    if(ohlc){
      drawCandles(document.getElementById('chart-'+a.id), ohlc, raw ? { emaFastArr: raw.emaFastArr, emaSlowArr: raw.emaSlowArr, bbUpper: raw.bbUpper, bbLower: raw.bbLower } : null);
      drawMacd(document.getElementById('macd-'+a.id), raw ? raw.macdHistArr : null);
    }
  });
  const book = focusedDepthAsset;
  loadDepth(book);
});

buildStyleTabs();
buildCards();
applyStaticText();
refreshAll();
resetRefreshTimer();
</script>
</body>
</html>
